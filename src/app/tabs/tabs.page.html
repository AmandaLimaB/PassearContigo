<!-- Estrutura de abas (Tabs) para navegação principal do aplicativo (Req. 3, 6 e 11) -->
<ion-tabs>
  <ion-tab-bar slot="bottom">
    
    <!-- Aba do Mapa (Página Principal) -->
    <ion-tab-button tab="map" layout="icon-top">
      <ion-icon name="map"></ion-icon>
      <ion-label>Mapa</ion-label>
    </ion-tab-button>

    <!-- Aba de Viagens -->
    <ion-tab-button tab="my-trips" layout="icon-top">
      <ion-icon name="calendar"></ion-icon>
      <ion-label>Viagens</ion-label>
    </ion-tab-button>

    <!-- Aba de Finanças -->
    <ion-tab-button tab="finances" layout="icon-top">
      <ion-icon name="cash"></ion-icon>
      <ion-label>Finanças</ion-label>
    </ion-tab-button>

    <!-- Aba de Perfil -->
    <ion-tab-button tab="profile" layout="icon-top">
      <ion-icon name="person"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
